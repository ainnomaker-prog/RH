name: Build HairWhite APK

on:
  push:
    paths:
      - 'hairwhite/**'
      - '.github/workflows/build-hairwhite-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: hairwhite
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp hairwhite/app/build/outputs/apk/debug/app-debug.apk HairWhite.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HairWhite-APK
          path: HairWhite.apk
          if-no-files-found: error
